name: Release

# Builds both packaged exes and the installer, then publishes them as a
# GitHub Release. Triggered by pushing a version tag, e.g.:
#   git tag v1.1.0 && git push origin v1.1.0

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build DeskGuard.exe
        run: pyinstaller --noconfirm DeskGuard.spec

      - name: Build DeskGuardWatchdog.exe
        run: pyinstaller --noconfirm DeskGuardWatchdog.spec

      - name: Place built exes in repo root
        run: |
          Copy-Item "dist\DeskGuard.exe" "DeskGuard.exe" -Force
          Copy-Item "dist\DeskGuardWatchdog.exe" "DeskGuardWatchdog.exe" -Force
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Determine version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            installer\DeskGuard.iss
        shell: pwsh

      - name: Create release
        run: |
          gh release create "${{ github.ref_name }}" `
            "installer/output/DeskGuardSetup.exe" `
            --title "${{ github.ref_name }}" `
            --notes-file installer/release_notes.md
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
